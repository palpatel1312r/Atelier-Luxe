<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" role="img" aria-labelledby="title description">
  <title id="title">SpacePedia</title>
  <desc id="description">SpacePedia logo with a glowing cyan and violet ringed planet on a deep space background.</desc>
  <defs>
    <radialGradient id="space" cx="50%" cy="35%" r="72%">
      <stop offset="0" stop-color="#17113a"/>
      <stop offset=".62" stop-color="#0d0922"/>
      <stop offset="1" stop-color="#070410"/>
    </radialGradient>
    <linearGradient id="planet" x1=".28" y1="0" x2=".72" y2="1">
      <stop offset="0" stop-color="#65e8f6"/>
      <stop offset=".49" stop-color="#87cef1"/>
      <stop offset="1" stop-color="#bf79ed"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#c781ef"/>
      <stop offset=".52" stop-color="#67dfee"/>
      <stop offset="1" stop-color="#8cdff4"/>
    </linearGradient>
    <linearGradient id="type" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#65e8f3"/>
      <stop offset="1" stop-color="#c37beb"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="11" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="15" flood-color="#020109" flood-opacity=".72"/>
    </filter>
  </defs>

  <rect width="1500" height="900" fill="url(#space)"/>
  <g fill="#bdefff" opacity=".34">
    <circle cx="302" cy="189" r="2"/><circle cx="1175" cy="197" r="2"/><circle cx="1082" cy="467" r="1.5"/><circle cx="370" cy="527" r="1.5"/>
  </g>

  <!-- Orbit behind the planet -->
  <ellipse cx="750" cy="337" rx="335" ry="67" transform="rotate(-20 750 337)" fill="none" stroke="#4c236f" stroke-width="39" filter="url(#glow)"/>
  <ellipse cx="750" cy="337" rx="335" ry="67" transform="rotate(-20 750 337)" fill="none" stroke="url(#orbit)" stroke-width="27"/>
  <ellipse cx="750" cy="337" rx="315" ry="52" transform="rotate(-20 750 337)" fill="none" stroke="#090615" stroke-width="13"/>

  <g filter="url(#shadow)">
    <circle cx="750" cy="337" r="187" fill="url(#planet)"/>
    <path d="M622 283c31-86 148-140 241-76-103-48-179-1-215 68-13 24-21 53-21 84-22-22-22-53-5-76Z" fill="#d8fbff" opacity=".2"/>
    <path d="M614 415c45 88 164 122 248 52-95 45-180 7-222-60-17-26-27-58-29-89-20 28-17 66 3 97Z" fill="#7b3fc9" opacity=".24"/>
  </g>

  <!-- Foreground orbit, placed over the planet for depth. -->
  <path d="M432 456c142 88 444 10 656-208" fill="none" stroke="#542179" stroke-linecap="round" stroke-width="43"/>
  <path d="M432 456c142 88 444 10 656-208" fill="none" stroke="url(#orbit)" stroke-linecap="round" stroke-width="28"/>
  <path d="M432 456c142 88 444 10 656-208" fill="none" stroke="#090615" stroke-linecap="round" stroke-width="13"/>

  <path d="M749 122c8 51 23 66 74 75-51 8-66 23-74 74-9-51-24-66-75-74 51-9 66-24 75-75Z" fill="#69e9f5" filter="url(#glow)"/>

  <text x="750" y="775" text-anchor="middle" fill="url(#type)" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="163" font-weight="900" letter-spacing="-5">SpacePedia</text>
</svg>
